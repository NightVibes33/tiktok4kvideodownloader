name: REAL Native iOS SwiftUI IPA (Fixed v2)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.3'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          cd native-ios
          xcodegen generate --spec project-fixed.yml

      - name: Build app
        run: |
          cd native-ios
          xcodebuild \
            -scheme TikTok4KNative \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Inspect built app bundle
        run: |
          APP_DIR="native-ios/build/Build/Products/Release-iphoneos/TikTok4KNative.app"
          test -d "$APP_DIR"
          echo "== APP DIRECTORY =="
          ls -lah "$APP_DIR"
          echo "== APP SIZE =="
          du -sh "$APP_DIR"
          echo "== APP BINARY =="
          ls -lah "$APP_DIR/TikTok4KNative"
          file "$APP_DIR/TikTok4KNative"

      - name: Package IPA
        run: |
          rm -rf Payload TikTok4KNative-v2.ipa
          mkdir Payload
          cp -R native-ios/build/Build/Products/Release-iphoneos/TikTok4KNative.app Payload/
          zip -r TikTok4KNative-v2.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TikTok4KNative-Fixed-v2
          path: TikTok4KNative-v2.ipa
