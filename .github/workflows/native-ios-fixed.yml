name: REAL Native iOS SwiftUI IPA (Fixed)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.3.0
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3.0'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          cd native-ios
          xcodegen generate --spec project-fixed.yml

      - name: Build app
        run: |
          cd native-ios
          xcodebuild \
            -scheme TikTok4KNative \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          rm -rf Payload TikTok4KNative.ipa
          mkdir Payload
          cp -R native-ios/build/Build/Products/Release-iphoneos/TikTok4KNative.app Payload/
          zip -r TikTok4KNative.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TikTok4KNative
          path: TikTok4KNative.ipa
