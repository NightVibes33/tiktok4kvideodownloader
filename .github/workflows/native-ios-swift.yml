name: REAL Native iOS SwiftUI IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-native-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare native app icon assets
        run: bash native-ios/apply_icon.sh

      - name: Generate Xcode project
        run: |
          cd native-ios
          xcodegen generate

      - name: Build native app
        run: |
          xcodebuild \
            -project native-ios/TikTok4KNative.xcodeproj \
            -scheme TikTok4KNative \
            -configuration Release \
            -destination generic/platform=iOS \
            -derivedDataPath "$RUNNER_TEMP/TikTok4KNativeDerivedData" \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/TikTok4KNativeDerivedData/Build/Products/Release-iphoneos/TikTok4KNative.app" Payload/TikTok4KNative.app
          cd Payload/..
          /usr/bin/zip -qry TikTok4KNative-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-swift-unsigned-ipa
          path: TikTok4KNative-unsigned.ipa
