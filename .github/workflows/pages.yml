name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Smoke-test exact YouTube video through eligible relay
        shell: bash
        env:
          TEST_URL: https://youtu.be/zzLrHzJrSi4?is=s8lEzsuXpNKlu3sL
          PAGE_ORIGIN: https://nightvibes33.github.io
        run: |
          set -u
          relays=(
            "https://tiktok4kvideodownloader-nc54.vercel.app/api/cobalt"
            "https://tiktok4kvideodownloader.vercel.app/api/cobalt"
          )
          payload=$(node -e 'process.stdout.write(JSON.stringify({url:process.env.TEST_URL,videoQuality:"1080",downloadMode:"auto"}))')
          winner=""
          first_ready=""

          for relay in "${relays[@]}"; do
            echo "::group::Testing $relay"
            ready=0
            for attempt in $(seq 1 20); do
              health=$(curl -sS --connect-timeout 5 --max-time 10 -o /tmp/relay-health.json -w '%{http_code}' -H "Origin: $PAGE_ORIGIN" "$relay" || true)
              if [[ "$health" == "200" ]] && grep -q '"strategy":"explicit-noauth-cors-intersection"' /tmp/relay-health.json 2>/dev/null; then
                ready=1
                [[ -z "$first_ready" ]] && first_ready="$relay"
                cat /tmp/relay-health.json
                echo
                break
              fi
              echo "Relay v1.2 not ready (attempt $attempt/20, HTTP $health)"
              sleep 2
            done

            if [[ "$ready" != "1" ]]; then
              echo "::endgroup::"
              continue
            fi

            http=$(curl -sS --connect-timeout 10 --max-time 45 \
              -D /tmp/relay.headers -o /tmp/relay.json -w '%{http_code}' \
              -H "Origin: $PAGE_ORIGIN" -H 'Accept: application/json' -H 'Content-Type: application/json' \
              --data "$payload" "$relay" || true)
            echo "Relay HTTP: $http"
            cat /tmp/relay.json 2>/dev/null || true
            echo

            if [[ "$http" == "200" ]]; then
              media=$(node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("/tmp/relay.json","utf8"));process.stdout.write(j.status==="tunnel"?j.url||"":"")' 2>/dev/null || true)
              if [[ -n "$media" ]]; then
                set +o pipefail
                curl -L -sS --connect-timeout 10 --max-time 35 -D /tmp/media.headers -H "Origin: $PAGE_ORIGIN" "$media" 2>/tmp/media.err | head -c 65536 > /tmp/media.bin
                set -o pipefail
                bytes=$(wc -c < /tmp/media.bin | tr -d ' ')
                media_acao=$(awk -F': ' 'tolower($1)=="access-control-allow-origin" {gsub("\r", "", $2); print $2}' /tmp/media.headers | tail -1)
                echo "Probe bytes: $bytes"
                echo "Tunnel CORS: ${media_acao:-missing}"
                if [[ "$bytes" -gt 0 && ( "$media_acao" == "*" || "$media_acao" == "$PAGE_ORIGIN" ) ]]; then
                  winner="$relay"
                  echo "PASS: exact video returned readable non-zero media"
                  echo "::endgroup::"
                  break
                fi
              fi
            fi
            echo "::endgroup::"
          done

          selected="${winner:-${first_ready:-https://tiktok4kvideodownloader-nc54.vercel.app/api/cobalt}}"
          echo "VITE_COBALT_RELAY=$selected" >> "$GITHUB_ENV"
          if [[ -n "$winner" ]]; then
            echo "### YouTube smoke test: ✅ PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "Exact test video returned non-zero browser-readable media through $winner." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No eligible community processor completed the exact-video test right now; publishing the site anyway so runtime discovery can recover when an eligible processor is available."
            echo "### YouTube smoke test: ⚠️ no eligible processor available at build time" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Vite app for GitHub Pages
        env:
          VITE_BASE_PATH: /tiktok4kvideodownloader/
          VITE_PUBLIC_SITE_URL: https://nightvibes33.github.io/tiktok4kvideodownloader
        run: npm run build

      - name: Add SPA fallback for direct routes
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
