name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Smoke-test exact YouTube video through JSON relay
        shell: bash
        env:
          TEST_URL: https://youtu.be/zzLrHzJrSi4?is=s8lEzsuXpNKlu3sL
          PAGE_ORIGIN: https://nightvibes33.github.io
        run: |
          set -u
          relays=(
            "https://tiktok4kvideodownloader-nc54.vercel.app/api/cobalt"
            "https://tiktok4kvideodownloader.vercel.app/api/cobalt"
          )

          payload=$(node -e 'process.stdout.write(JSON.stringify({url:process.env.TEST_URL,videoQuality:"1080",downloadMode:"auto"}))')
          winner=""

          for relay in "${relays[@]}"; do
            echo "::group::Testing relay $relay"
            ready=0
            for attempt in $(seq 1 20); do
              health=$(curl -sS --connect-timeout 5 --max-time 10 -o /tmp/relay-health.json -w '%{http_code}' -H "Origin: $PAGE_ORIGIN" "$relay" || true)
              if [[ "$health" == "200" ]] && grep -q '"ok":true' /tmp/relay-health.json 2>/dev/null && grep -q '"strategy":"live-directory-race"' /tmp/relay-health.json 2>/dev/null; then
                ready=1
                break
              fi
              echo "Relay new version not ready yet (attempt $attempt/20, HTTP $health)"
              sleep 2
            done

            if [[ "$ready" != "1" ]]; then
              echo "Rejected: new relay version never became ready"
              echo "::endgroup::"
              continue
            fi

            rm -f /tmp/relay.json /tmp/relay.headers /tmp/media.headers /tmp/media.bin
            http=$(curl -sS --connect-timeout 10 --max-time 40 \
              -D /tmp/relay.headers \
              -o /tmp/relay.json \
              -w '%{http_code}' \
              -H "Origin: $PAGE_ORIGIN" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              --data "$payload" \
              "$relay" || true)

            echo "Relay HTTP: $http"
            cat /tmp/relay.json 2>/dev/null || true
            echo

            if [[ "$http" != "200" ]]; then
              echo "Rejected: relay did not return HTTP 200"
              echo "::endgroup::"
              continue
            fi

            acao=$(awk -F': ' 'tolower($1)=="access-control-allow-origin" {gsub("\r", "", $2); print $2}' /tmp/relay.headers | tail -1)
            if [[ "$acao" != "*" && "$acao" != "$PAGE_ORIGIN" ]]; then
              echo "Rejected: relay CORS is '$acao'"
              echo "::endgroup::"
              continue
            fi

            status=$(node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("/tmp/relay.json","utf8")); process.stdout.write(j.status||"")' 2>/dev/null || true)
            media=$(node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("/tmp/relay.json","utf8")); process.stdout.write(j.url||"")' 2>/dev/null || true)

            if [[ "$status" != "tunnel" || -z "$media" ]]; then
              echo "Rejected: expected tunnel, got '$status'"
              echo "::endgroup::"
              continue
            fi

            set +o pipefail
            curl -L -sS --connect-timeout 10 --max-time 35 \
              -D /tmp/media.headers \
              -H "Origin: $PAGE_ORIGIN" \
              "$media" 2>/tmp/media.err | head -c 65536 > /tmp/media.bin
            set -o pipefail

            bytes=$(wc -c < /tmp/media.bin | tr -d ' ')
            media_acao=$(awk -F': ' 'tolower($1)=="access-control-allow-origin" {gsub("\r", "", $2); print $2}' /tmp/media.headers | tail -1)
            echo "Probe bytes: $bytes"
            echo "Tunnel CORS: ${media_acao:-missing}"

            if [[ "$bytes" -le 0 ]]; then
              echo "Rejected: tunnel returned no media bytes"
              cat /tmp/media.err 2>/dev/null || true
              echo "::endgroup::"
              continue
            fi

            if [[ "$media_acao" != "*" && "$media_acao" != "$PAGE_ORIGIN" ]]; then
              echo "Rejected: media tunnel CORS is '$media_acao'"
              echo "::endgroup::"
              continue
            fi

            winner="$relay"
            echo "PASS: exact video returned readable non-zero media through the Pages architecture"
            echo "::endgroup::"
            break
          done

          if [[ -z "$winner" ]]; then
            echo "::error::No relay passed the exact-video + CORS + non-zero-media smoke test."
            exit 1
          fi

          echo "Selected relay: $winner"
          echo "VITE_COBALT_RELAY=$winner" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Vite app for GitHub Pages
        env:
          VITE_BASE_PATH: /tiktok4kvideodownloader/
          VITE_PUBLIC_SITE_URL: https://nightvibes33.github.io/tiktok4kvideodownloader
        run: npm run build

      - name: Add SPA fallback for direct routes
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
