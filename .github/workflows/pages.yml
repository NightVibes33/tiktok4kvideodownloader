name: Validate GitHub Pages source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Vite production build
        env:
          VITE_BASE_PATH: /tiktok4kvideodownloader/
          VITE_PUBLIC_SITE_URL: https://nightvibes33.github.io/tiktok4kvideodownloader
        run: npm run build

      - name: Verify physical legacy Pages routes
        run: |
          test -f youtube/index.html
          test -f 404.html
          grep -q "YouTube Downloader" youtube/index.html
