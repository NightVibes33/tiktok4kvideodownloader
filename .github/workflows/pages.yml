name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Smoke-test exact YouTube video and choose processor
        shell: bash
        env:
          TEST_URL: https://youtu.be/zzLrHzJrSi4?is=s8lEzsuXpNKlu3sL
          PAGE_ORIGIN: https://nightvibes33.github.io
        run: |
          set -u
          candidates=(
            "https://api.cobalt.liubquanti.click/"
            "https://rue-cobalt.xenon.zone/"
            "https://cobaltapi.cjs.nz/"
            "https://cobaltapi.kittycat.boo/"
            "https://nuko-c.meowing.de/"
          )

          payload=$(node -e 'process.stdout.write(JSON.stringify({url:process.env.TEST_URL,videoQuality:"1080",youtubeVideoCodec:"h264",youtubeVideoContainer:"mp4",downloadMode:"auto",filenameStyle:"pretty",disableMetadata:false,alwaysProxy:true,localProcessing:"disabled"}))')
          winner=""

          for api in "${candidates[@]}"; do
            echo "::group::Testing $api"
            rm -f /tmp/cobalt.json /tmp/cobalt.headers /tmp/media.headers /tmp/media.bin

            http=$(curl -sS --connect-timeout 10 --max-time 50 \
              -D /tmp/cobalt.headers \
              -o /tmp/cobalt.json \
              -w '%{http_code}' \
              -H "Origin: $PAGE_ORIGIN" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              --data "$payload" \
              "$api" || true)

            echo "API HTTP: $http"
            cat /tmp/cobalt.json 2>/dev/null || true
            echo

            if [[ "$http" != "200" ]]; then
              echo "Rejected: API did not return HTTP 200"
              echo "::endgroup::"
              continue
            fi

            acao=$(awk -F': ' 'tolower($1)=="access-control-allow-origin" {gsub("\r", "", $2); print $2}' /tmp/cobalt.headers | tail -1)
            if [[ "$acao" != "*" && "$acao" != "$PAGE_ORIGIN" ]]; then
              echo "Rejected: API CORS is '$acao'"
              echo "::endgroup::"
              continue
            fi

            status=$(node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("/tmp/cobalt.json","utf8")); process.stdout.write(j.status||"")' 2>/dev/null || true)
            media=$(node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("/tmp/cobalt.json","utf8")); process.stdout.write(j.url||"")' 2>/dev/null || true)

            if [[ "$status" != "tunnel" || -z "$media" ]]; then
              echo "Rejected: expected a tunnel response, got '$status'"
              echo "::endgroup::"
              continue
            fi

            set +o pipefail
            curl -L -sS --connect-timeout 10 --max-time 35 \
              -D /tmp/media.headers \
              -H "Origin: $PAGE_ORIGIN" \
              "$media" 2>/tmp/media.err | head -c 65536 > /tmp/media.bin
            set -o pipefail

            bytes=$(wc -c < /tmp/media.bin | tr -d ' ')
            media_acao=$(awk -F': ' 'tolower($1)=="access-control-allow-origin" {gsub("\r", "", $2); print $2}' /tmp/media.headers | tail -1)
            echo "Probe bytes: $bytes"
            echo "Tunnel CORS: ${media_acao:-missing}"

            if [[ "$bytes" -le 0 ]]; then
              echo "Rejected: tunnel returned no media bytes"
              cat /tmp/media.err 2>/dev/null || true
              echo "::endgroup::"
              continue
            fi

            if [[ "$media_acao" != "*" && "$media_acao" != "$PAGE_ORIGIN" ]]; then
              echo "Rejected: tunnel CORS is '$media_acao'"
              echo "::endgroup::"
              continue
            fi

            winner="$api"
            echo "PASS: exact video returned a readable non-zero media stream"
            echo "::endgroup::"
            break
          done

          if [[ -z "$winner" ]]; then
            echo "::error::No processor passed the exact-video + CORS + non-zero-media smoke test."
            exit 1
          fi

          echo "Selected processor: $winner"
          echo "VITE_COBALT_PRIMARY=$winner" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app for GitHub Pages
        env:
          VITE_BASE_PATH: /tiktok4kvideodownloader/
          VITE_PUBLIC_SITE_URL: https://nightvibes33.github.io/tiktok4kvideodownloader
        run: npm run build

      - name: Add SPA fallback for direct routes
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
