services:
  youtube:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8787"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set public HTTPS hostname}
      COBALT_API_KEY: ${COBALT_API_KEY:?Choose an API key and also set on Vercel}
      DOWNLOAD_TOKEN_SECRET: ${DOWNLOAD_TOKEN_SECRET:?Choose a separate signing secret}
      MAX_CONCURRENT: "2"
      MAX_BYTES: "4294967296"
    ports:
      - "127.0.0.1:8787:8787"
